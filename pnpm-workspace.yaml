# Write exact versions on `pnpm add` rather than ^ ranges.
saveExact: true

allowBuilds:
  esbuild: true
  lightningcss: true
  # Node-only optional deps of @huggingface/transformers / onnxruntime-web —
  # this app only runs these libraries in the browser, so their native
  # builds are unused.
  onnxruntime-node: false
  protobufjs: false
  sharp: false

packageExtensions:
  # Transformers.js imports `Tensor` from onnxruntime-common without declaring
  # it, and only resolved it while some other package happened to get it
  # hoisted. Pinned to the onnxruntime-common our onnxruntime-web depends on,
  # so both share one copy. Keyed to the version, so a bump drops this and the
  # build fails until it is checked again.
  '@huggingface/transformers@4.3.0':
    dependencies:
      onnxruntime-common: 1.31.0-dev.20260911-2a43ec07e
