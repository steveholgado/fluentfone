# Write exact versions on `pnpm add` rather than ^ ranges.
saveExact: true

allowBuilds:
  esbuild: true
  lightningcss: true
  # Node-only optional deps of @huggingface/transformers / onnxruntime-web —
  # this app only runs these libraries in the browser, so their native
  # builds are unused.
  onnxruntime-node: false
  protobufjs: false
  sharp: false

patchedDependencies:
  '@mintplex-labs/piper-tts-web@1.0.5': patches/@mintplex-labs__piper-tts-web@1.0.5.patch
